# ============================================================
# Nginx config cho Frontend container
# - Serve React SPA (với SPA fallback)
# - Reverse proxy /api → backend:8000
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bảo mật: ẩn version Nginx
    server_tokens off;

    # Nén response để tăng tốc độ tải
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Cache lâu cho assets (có hash trong tên file)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* → backend container
    location /api/ {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Timeout cho request dịch file lớn
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # SPA fallback: mọi route trả về index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
