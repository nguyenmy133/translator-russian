services:
  # ── Backend: FastAPI ───────────────────────────────────────────────
  - type: web
    name: email-translator-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      - key: FRONTEND_URL
        sync: false   # URL của frontend sau khi deploy

  # ── Frontend: React Static Site ───────────────────────────────────
  - type: web
    name: email-translator-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback
    envVars:
      - key: VITE_API_URL
        fromService:
          name: email-translator-api
          type: web
          property: host
