# ============================================================
# GitHub Actions — Tự Động Deploy Lên VPS Khi Push Code
#
# Workflow này sẽ tự động:
#   1. Kết nối SSH vào VPS 103.77.243.1
#   2. Pull code mới nhất từ GitHub
#   3. Rebuild và restart Docker containers
#
# Trigger: Mỗi khi có push vào nhánh "main"
# ============================================================
name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            echo "=============================="
            echo "  Auto Deploy — $(date)"
            echo "=============================="

            cd /opt/email-translator

            echo "--- Pull code mới nhất..."
            git pull origin main

            echo "--- Rebuild Docker containers..."
            docker compose build --no-cache

            echo "--- Restart containers..."
            docker compose up -d --remove-orphans

            echo "--- Dọn dẹp image cũ..."
            docker image prune -f

            echo "--- Trạng thái hiện tại:"
            docker compose ps

            echo "=============================="
            echo "  ✅ Deploy thành công!"
            echo "=============================="
